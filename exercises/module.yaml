product: jvm/app

dependencies:
  - org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0

settings:
  kotlin:
    freeCompilerArgs:
      - "-Xcollection-literals"
      - "-Xintrinsic-const-evaluation"
      - "-Xreturn-value-checker=full"
      - "-Xcontext-sensitive-resolution"
      - "-Xname-based-destructuring=complete"